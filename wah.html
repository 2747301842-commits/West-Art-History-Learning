<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#12100e">
<title>西方美术史 · 斩</title>
<style>
:root{
  --bg:#12100e; --card:#211d19; --card2:#1a1714; --line:#332d27;
  --txt:#f2ece3; --dim:#9a8f82; --gold:#e0a94a; --gold2:#c98c2f;
  --green:#3fbf7f; --red:#e05c5c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:radial-gradient(1100px 560px at 50% -8%,#282219 0%,#12100e 62%);
  color:var(--txt);min-height:100vh;touch-action:manipulation;
}
#view{max-width:560px;margin:0 auto;padding:22px 16px 70px;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.btn{
  display:block;width:100%;padding:15px 18px;margin:10px 0;border:none;border-radius:14px;
  background:var(--card);color:var(--txt);font-size:16px;font-weight:600;cursor:pointer;
  border:1px solid var(--line);transition:.15s;font-family:inherit;
}
.btn:active{transform:scale(.985)}
.btn.primary{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#20180a;border:none;box-shadow:0 6px 22px -8px var(--gold)}
.btn.ghost{background:transparent;color:var(--dim);border:1px dashed var(--line);font-weight:500;font-size:14px}
.btn.small{font-size:14px;padding:11px 14px}
.row2{display:flex;gap:10px}
.row2 .btn{margin:0}
.icon-btn{background:none;border:none;color:var(--dim);font-size:20px;width:36px;height:36px;cursor:pointer;border-radius:10px}
.icon-btn:active{background:#ffffff10}
.hero{text-align:center;padding:18px 0 6px}
.hero h1{margin:0;font-size:27px;letter-spacing:3px;font-weight:800;
  background:linear-gradient(135deg,#f6d9a0,#e0a94a 55%,#a9761f);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:8px 0 0;color:var(--dim);font-size:13px;letter-spacing:1px}
.ring-wrap{position:relative;width:170px;height:170px;margin:22px auto 14px}
.ring{width:170px;height:170px;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:#2a2520;stroke-width:11}
.ring-fg{fill:none;stroke:var(--gold);stroke-width:11;stroke-linecap:round;
  transition:stroke-dashoffset .7s cubic-bezier(.4,0,.2,1);filter:drop-shadow(0 0 8px #e0a94a55)}
.ring-num{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring-num b{display:block;font-size:38px;font-weight:800;color:var(--gold)}
.ring-num span{font-size:12px;color:var(--dim)}
.stat-row{display:flex;gap:10px;margin:14px 0 20px}
.stat-row>div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center}
.stat-row b{display:block;font-size:20px;color:var(--txt)}
.stat-row span{font-size:11px;color:var(--dim)}
.tip{font-size:12px;color:#7d7266;line-height:1.8;text-align:center;margin-top:18px}
.tip code{background:#ffffff0d;padding:1px 5px;border-radius:4px;color:var(--gold);font-size:11px}
.study-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.bar{flex:1;height:6px;background:#2a2520;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));
  border-radius:3px;transition:width .35s ease}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;
  box-shadow:0 18px 40px -24px #000}
.imgbox{position:relative;width:100%;aspect-ratio:4/3;border-radius:16px;overflow:hidden;
  background:linear-gradient(140deg,hsl(var(--h) 42% 20%),hsl(calc(var(--h) + 45) 45% 9%));
  display:grid;place-items:center}
.imgbox .ph{position:absolute;inset:0;display:grid;place-items:center;
  font-size:15px;font-weight:700;letter-spacing:2px;color:#ffffff22}
.imgbox img{position:relative;width:100%;height:100%;object-fit:cover;display:block}
.qtext{font-size:17px;font-weight:700;text-align:center;margin:16px 4px 14px;line-height:1.5}
.opts{display:grid;gap:9px}
.opt{
  width:100%;padding:14px 16px;border-radius:13px;background:var(--card2);
  border:1px solid var(--line);color:var(--txt);font-size:15px;font-weight:500;
  text-align:left;cursor:pointer;transition:.15s;font-family:inherit;line-height:1.35;
}
.opt:active{transform:scale(.985)}
.opt.correct{background:#1d3a2b;border-color:var(--green);color:#8ff0bd}
.opt.wrong{background:#3a1d1d;border-color:var(--red);color:#ff9a9a;animation:shake .35s}
.opt.disabled{pointer-events:none;opacity:.75}
.opt.correct.disabled,.opt.wrong.disabled{opacity:1}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.answer{margin-top:16px;border-top:1px solid var(--line);padding-top:14px;animation:fade .2s}
.verdict{font-size:15px;font-weight:800;margin-bottom:12px}
.verdict.ok{color:var(--green)}
.verdict.no{color:var(--red)}
.info .row{display:flex;gap:12px;padding:6px 2px;font-size:13.5px;line-height:1.5}
.info .row span{color:var(--dim);min-width:42px;flex:none}
.info .row b{font-weight:600;color:var(--txt)}
.actions{display:flex;gap:10px;margin-top:16px}
.actions .btn{margin:0;font-size:14px;padding:13px 10px}
.result{text-align:center;padding-top:50px}
.result .big{font-size:64px;animation:pop .4s}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.result h2{font-size:22px;margin:10px 0 26px}
.result-grid{display:flex;gap:10px;margin-bottom:28px}
.result-grid>div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 6px}
.result-grid b{display:block;font-size:24px;color:var(--gold)}
.result-grid span{font-size:11px;color:var(--dim)}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.topbar-title{font-size:16px;font-weight:700}
.search{width:100%;padding:13px 16px;border-radius:13px;background:var(--card);
  border:1px solid var(--line);color:var(--txt);font-size:14px;outline:none;font-family:inherit;margin-bottom:14px}
.search:focus{border-color:var(--gold2)}
.brow-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);
  border:1px solid var(--line);border-radius:13px;margin-bottom:8px;cursor:pointer}
.brow-idx{width:30px;flex:none;font-size:11px;color:var(--dim);font-weight:700;text-align:center}
.brow-main{flex:1;min-width:0}
.brow-name{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow-sub{font-size:11.5px;color:var(--dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:9px;height:9px;border-radius:50%;background:#3a332c;flex:none}
.mastered .dot{background:var(--green);box-shadow:0 0 8px var(--green)}
.learning .dot{background:var(--gold)}
.brow-detail{display:none;padding:12px 0 16px}
.brow-detail.open{display:block;animation:fade .2s}
.brow-detail .imgbox{margin-bottom:10px}
.brow-sub2{font-size:12px;color:var(--dim);text-align:center;line-height:1.6}
.import-box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.import-box .t{font-size:13px;color:var(--dim);line-height:1.7;margin-bottom:10px}
.import-box .t b{color:var(--gold)}
</style>
</head>

/* ---------- 图片存储（IndexedDB） ---------- */
const DB_NAME = 'artImages', STORE = 'imgs';
let IMG_MAP = {};          // id -> objectURL
let IMG_OK  = new Set();   // images/ 文件夹探测成功的

function openDB(){
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function dbPut(id, blob){
  const db = await openDB();
  return new Promise((res, rej) => {
    const t = db.transaction(STORE, 'readwrite');
    t.objectStore(STORE).put(blob, String(id));
    t.oncomplete = res; t.onerror = () => rej(t.error);
  });
}
async function dbGetAll(){
  const db = await openDB();
  return new Promise((res, rej) => {
    const t = db.transaction(STORE, 'readonly');
    const req = t.objectStore(STORE).openCursor();
    const out = [];
    req.onsuccess = e => {
      const c = e.target.result;
      if(c){ out.push([+c.key, c.value]); c.continue(); }
      else res(out);
    };
    req.onerror = () => rej(req.error);
  });
}
async function dbClear(){
  const db = await openDB();
  return new Promise((res, rej) => {
    const t = db.transaction(STORE, 'readwrite');
    t.objectStore(STORE).clear();
    t.oncomplete = res; t.onerror = () => rej(t.error);
  });
}

async function importFiles(fileList){
  const files = [...fileList].filter(f => f.type.startsWith('image/'));
  if(!files.length){ alert('没有选中图片'); return; }

  const used = new Set(Object.keys(IMG_MAP).map(Number));
  const pending = [];
  let byName = 0;

  // 1) 文件名以数字开头（如 056_蒙娜丽莎.jpg / 56.jpg）→ 按编号对应
  for(const f of files){
    const m = f.name.match(/^(\d{1,3})/);
    if(m){
      const n = parseInt(m[1], 10);
      if(n >= 1 && n <= 222 && !used.has(n)){
        used.add(n);
        await putImg(n, f);
        byName++;
        continue;
      }
    }
    pending.push(f);
  }

  // 2) 其余按选择顺序，依次填入最小未占用编号
  let next = 1;
  for(const f of pending){
    while(next <= 222 && used.has(next)) next++;
    if(next > 222) break;
    used.add(next);
    await putImg(next, f);
    next++;
  }

  const total = imgCount();
  alert(`本次导入 ${files.length} 张\n其中按文件名对应 ${byName} 张，按顺序补齐 ${files.length - byName} 张\n当前已有 ${total} / 222 张`);
  renderHome();
}

async function putImg(id, file){
  const url = URL.createObjectURL(file);
  if(IMG_MAP[id]) URL.revokeObjectURL(IMG_MAP[id]);
  IMG_MAP[id] = url;
  try { await dbPut(id, file); } catch(e){}
}

function imgBox(item){
  const h = (item.id * 53) % 360;
  return `<div class="imgbox" style="--h:${h}">
    <div class="ph">No.${item.id}</div>
    <img src="${srcOf(item.id)}" alt="${esc(item.name)}" onerror="this.style.display='none'">
  </div>`;
}

function makeOptions(item, key){
  const correct = item[key];
  const others = DATA.filter(d => d.id !== item.id);
  const sameC  = others.filter(d => d.century === item.century);
  const rest   = others.filter(d => d.century !== item.century);
  const seen = new Set([correct]);
  const picked = [];
  for(const d of shuffle(sameC).concat(shuffle(rest))){
    const v = d[key];
    if(!v || seen.has(v)) continue;
    seen.add(v);
    picked.push(v);
    if(picked.length === 3) break;
  }
  return shuffle([correct, ...picked]);
}

function makeQuestion(item){
  const rec = getRec(item.id);
  const seen = rec ? rec.seen : 0;
  const im = hasImg(item.id);

  let type = ['name','artist','century'][(item.id + seen) % 3];
  if(type === 'artist' && item.artist === '佚名') type = im ? 'name' : 'century';
  if(type === 'name' && !im) type = item.artist === '佚名' ? 'century' : 'artist';

  if(type === 'name') return { type, text:'这幅作品的名称是？', answer:item.name, options:makeOptions(item,'name') };
  if(type === 'artist') return { type, text:'这幅作品的作者是？', answer:item.artist, options:makeOptions(item,'artist') };
  return { type, text:`《${item.name}》大约创作于？`, answer:item.century, options:makeOptions(item,'century') };
}

   7. 会话
   ========================================================= */
function buildQueue(mode, limit){
  const now = Date.now();
  const due = [], fresh = [];
  for(const d of DATA){
    const r = getRec(d.id);
    if(r && r.mastered) continue;
    if(!r || !r.seen) fresh.push(d.id);
    else if((r.due || 0) <= now) due.push(d.id);
  }
  shuffle(due); shuffle(fresh);

  let q = [];
  if(mode === 'due') q = due.slice(0, limit);
  else if(mode === 'new') q = fresh.slice(0, limit);
  else {
    const half = Math.ceil(limit / 2);
    q = due.slice(0, half);
    if(q.length < limit) q = q.concat(fresh.slice(0, limit - q.length));
    if(q.length < limit) q = q.concat(due.slice(half, half + (limit - q.length)));
  }
  return shuffle(q);
}

function startSession(mode = 'mix', limit = 20){
  const ids = buildQueue(mode, limit);
  if(!ids.length){
    alert(mode === 'due' ? '暂时没有待复习的卡片，先去学习吧～' : '没有可学习的卡片啦～');
    return;
  }
  S = { queue: ids, done: 0, right: 0, wrong: 0, current: null, q: null, answered: false, selected: null, requeued: new Set() };
  loadNext();
  showView('study');
}

function loadNext(){
  if(!S.queue.length){ finishSession(); return; }
  const id = S.queue.shift();
  const item = BY_ID[id];
  S.current = { item };

  S.selected = null;

  window.scrollTo({ top:0, behavior:'smooth' });
}

    const v = b.dataset.val;
    if(v === S.q.answer) b.classList.add('correct');
    else if(S.selected !== null && v === S.selected) b.classList.add('wrong');
    b.classList.add('disabled');
  });
}

function answerPanel(item){
  const ok = S.selected !== null && S.selected === S.q.answer;
  return `<div class="answer">
    <div class="verdict ${ok ? 'ok' : 'no'}">
      ${ok ? '✅ 答对了' : (S.selected === null ? '👀 看答案' : '❌ 答错了')}
    </div>
    <div class="info">
      <div class="row"><span>作品</span><b>${esc(item.name)}</b></div>
      <div class="row"><span>作者</span><b>${esc(item.artist)}</b></div>
      <div class="row"><span>年代</span><b>${esc(item.year)}　（${esc(item.century)}）</b></div>
      <div class="row"><span>流派</span><b>${esc(item.country)}</b></div>
    </div>
    <div class="actions">
      <button class="btn ghost" data-act="kill">🎯 已掌握</button>
      <button class="btn primary" data-act="next">下一张 →</button>
    </div>
  </div>`;
}

function pickOption(val){
  if(!S || S.answered) return;
  S.selected = val;
  S.answered = true;
  const item = S.current.item;
  const r = ensureRec(item.id);
  r.seen++;
  const correct = val === S.q.answer;
  if(correct){
    r.right++;
    r.box = Math.min(r.box + 1, MASTER_BOX);
    if(r.box >= MASTER_BOX) r.mastered = true;
    r.due = Date.now() + INTERVALS[r.box];
    S.right++;
  } else {
    r.wrong++;
    r.box = Math.max(0, r.box - 1);
    r.due = Date.now() + 10 * 60000;
    S.wrong++;
    if(!S.requeued.has(item.id)){
      S.requeued.add(item.id);
      S.queue.splice(Math.min(4, S.queue.length), 0, item.id);
    }
  }
  save();
  renderStudy();
}

function revealAnswer(){
  if(!S || S.answered) return;
  S.selected = null;
  S.answered = true;
  const item = S.current.item;
  const r = ensureRec(item.id);
  r.seen++;
  r.wrong++;
  r.box = Math.max(0, r.box - 1);
  r.due = Date.now() + 10 * 60000;
  S.wrong++;
  if(!S.requeued.has(item.id)){
    S.requeued.add(item.id);
    S.queue.splice(Math.min(4, S.queue.length), 0, item.id);
  }
  save();
  renderStudy();
}

function killCard(){
  if(!S) return;
  const r = ensureRec(S.current.item.id);
  r.mastered = true;
  r.box = MASTER_BOX;
  save();
  nextCard();
}

function nextCard(){
  if(!S) return;
  S.done++;
  loadNext();
}

function finishSession(){
  const total = S.right + S.wrong;
  const pct = total ? Math.round(S.right / total * 100) : 0;
  const right = S.right, wrong = S.wrong;
  S = null;
  view.innerHTML = `
    <div class="result">
      <div class="big">🎉</div>
      <h2>本轮完成</h2>
      <div class="result-grid">
        <div><b>${right}</b><span>答对</span></div>
        <div><b>${wrong}</b><span>答错</span></div>
        <div><b>${pct}%</b><span>正确率</span></div>
      </div>
      <button class="btn primary" data-act="start">再来一轮</button>
      <button class="btn ghost" data-act="home">回到首页</button>
    </div>
  `;
  currentView = 'result';
}

/* =========================================================
   8. 图鉴
   ========================================================= */
function renderBrowse(){
  const items = DATA.map(d => {
    const r = getRec(d.id);
    const st = (r && r.mastered) ? 'mastered' : (r && r.seen) ? 'learning' : 'new';
    return `<div class="brow-item ${st}" data-act="expand" data-id="${d.id}">
        <div class="brow-idx">${d.id}</div>
        <div class="brow-main">
          <div class="brow-name">${esc(d.name)}</div>
          <div class="brow-sub">${esc(d.artist)} · ${esc(d.year)} · ${esc(d.country)}</div>
        </div>
        <div class="dot"></div>
      </div>
      <div class="brow-detail" id="det-${d.id}">
        ${imgBox(d)}
        <div class="brow-sub2">${esc(d.name)}<br>${esc(d.artist)}　|　${esc(d.year)}　|　${esc(d.century)}　|　${esc(d.country)}</div>
      </div>`;
  }).join('');

  view.innerHTML = `
    <div class="topbar">
      <button class="icon-btn" data-act="home">←</button>
      <div class="topbar-title">图鉴 · ${DATA.length} 件</div>
      <div style="width:36px"></div>
    </div>
    <input class="search" id="searchBox" placeholder="搜索 作品 / 作者 / 流派 / 世纪">
    <div id="browList">${items}</div>
  `;

  const box = document.getElementById('searchBox');
  box.addEventListener('input', e => {
    const v = e.target.value.trim();
    document.querySelectorAll('.brow-item').forEach(el => {
      const d = BY_ID[el.dataset.id];
      const hay = d.name + d.artist + d.country + d.century + d.year;
      const hit = !v || hay.includes(v);
      el.style.display = hit ? '' : 'none';
      const det = document.getElementById('det-' + d.id);
      if(det) det.style.display = hit ? '' : 'none';
    });
  });
}

/* =========================================================
   9. 事件
   ========================================================= */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;

  switch(act){
    case 'start':   startSession('mix', 20); break;
    case 'review':  startSession('due', 50); break;
    case 'browse':  showView('browse'); break;
    case 'home':    showView('home'); break;
    case 'import':  document.getElementById('fileInput').click(); break;
    case 'clearImgs':
      if(confirm('清空已导入的照片？（学习进度不受影响）')){
        Object.values(IMG_MAP).forEach(u => { try{ URL.revokeObjectURL(u); }catch(e){} });
        IMG_MAP = {};
        try{ await dbClear(); }catch(e){}
        renderHome();
      }
      break;
    case 'quit':
      if(confirm('结束本轮学习？')) { S = null; showView('home'); }
      break;
    case 'pick':    pickOption(el.dataset.val); break;
    case 'reveal':  revealAnswer(); break;
    case 'next':    nextCard(); break;
    case 'kill':    killCard(); break;
    case 'expand': {
      const det = document.getElementById('det-' + el.dataset.id);
      if(det) det.classList.toggle('open');
      break;
    }
    case 'reset':
      if(confirm('确定要清空所有学习进度吗？此操作不可恢复。')){
        store = {};
        save();
        renderHome();
      }
      break;
  }
});

document.addEventListener('change', async e => {
  if(e.target.id === 'fileInput'){
    const files = e.target.files;
    if(files && files.length){
      el_disabled(true);
      try { await importFiles(files); }
      catch(err){ alert('导入出错：' + err.message); }
      el_disabled(false);
    }
    e.target.value = '';
  }
});

function el_disabled(on){
  document.querySelectorAll('.btn').forEach(b => { b.style.pointerEvents = on ? 'none' : ''; b.style.opacity = on ? '.5' : ''; });
}

document.addEventListener('keydown', e => {
  if(currentView !== 'study' || !S) return;
  if(e.key >= '1' && e.key <= '4'){
    const btns = document.querySelectorAll('.opt');
    const i = +e.key - 1;
    if(btns[i] && !S.answered) btns[i].click();
  }
  if(e.key === 'Enter' || e.key === ' '){
    e.preventDefault();
    if(S.answered){
      const b = document.querySelector('[data-act="next"]');
      if(b) b.click();
    } else {
      const b = document.querySelector('[data-act="reveal"]');
      if(b) b.click();
    }
  }
});

/* =========================================================
   10. 启动：先读回已存图片，再渲染
   ========================================================= */
(async function boot(){
  try {
    const rows = await dbGetAll();
    rows.forEach(([id, blob]) => {
      try { IMG_MAP[id] = URL.createObjectURL(blob); } catch(e){}
    });
  } catch(e){}
  probeImages();
  renderHome();
})();
</script>
